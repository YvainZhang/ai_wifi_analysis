<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">WiFi Analyzer — Project Architecture</text>

  <!-- ===== Layer 1: Input ===== -->
  <rect x="30" y="60" width="900" height="80" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="82" font-size="11" fill="#0d9488" font-weight="600">INPUT</text>

  <!-- pcapng file -->
  <g filter="url(#shadow)">
    <rect x="120" y="88" width="160" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="200" y="113" text-anchor="middle" font-size="13" fill="#111827">.pcapng</text>
  </g>
  <!-- OmniPeek file -->
  <g filter="url(#shadow)">
    <rect x="380" y="88" width="160" height="40" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="460" y="113" text-anchor="middle" font-size="13" fill="#111827">OmniPeek .pkt</text>
  </g>
  <!-- 问题描述 -->
  <g filter="url(#shadow)">
    <rect x="640" y="88" width="160" height="40" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="720" y="113" text-anchor="middle" font-size="13" fill="#111827">问题描述.md</text>
  </g>

  <!-- Arrows: Input -> Parsers -->
  <line x1="200" y1="128" x2="200" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="460" y1="128" x2="460" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== Layer 2: Parsers ===== -->
  <rect x="30" y="160" width="900" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="182" font-size="11" fill="#2563eb" font-weight="600">PARSERS</text>

  <!-- pcapng_parser.py -->
  <g filter="url(#shadow)">
    <rect x="80" y="190" width="240" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">pcapng_parser.py</text>
  </g>
  <!-- omnipeek_parser.py -->
  <g filter="url(#shadow)">
    <rect x="370" y="190" width="240" height="40" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="490" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">omnipeek_parser.py</text>
  </g>
  <!-- import note -->
  <text x="330" y="215" text-anchor="middle" font-size="10" fill="#6b7280">imports</text>
  <line x1="320" y1="210" x2="340" y2="210" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow-gray)" stroke-dasharray="3,2"/>

  <!-- Arrow: Parsers -> Unified Dict -->
  <path d="M 200 230 L 200 260 L 480 260 L 480 280" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 490 230 L 490 260 L 480 260" stroke="#16a34a" stroke-width="1.5" fill="none"/>

  <!-- ===== Layer 3: Unified Dict + Analysis ===== -->
  <rect x="30" y="265" width="900" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="287" font-size="11" fill="#16a34a" font-weight="600">DATA EXTRACTION</text>

  <!-- Unified Dict -->
  <g filter="url(#shadow)">
    <rect x="310" y="295" width="220" height="36" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="420" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Unified Result Dict</text>
  </g>
  <!-- dict fields -->
  <text x="420" y="348" text-anchor="middle" font-size="10" fill="#6b7280">meta · frame_stats · ba_events · disconnect_events</text>
  <text x="420" y="362" text-anchor="middle" font-size="10" fill="#6b7280">assoc_events · dhcp_events · signal_data · retransmit_stats</text>

  <!-- analyze.py -->
  <g filter="url(#shadow)">
    <rect x="600" y="295" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="690" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">analyze.py</text>
  </g>
  <text x="690" y="348" text-anchor="middle" font-size="10" fill="#6b7280">issue detection + report gen</text>
  <line x1="530" y1="313" x2="598" y2="313" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- hw_metrics.py -->
  <g filter="url(#shadow)">
    <rect x="80" y="295" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="170" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">hw_metrics.py</text>
  </g>
  <text x="170" y="348" text-anchor="middle" font-size="10" fill="#6b7280">radiotap hardware diagnostics</text>
  <line x1="200" y1="230" x2="170" y2="293" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>

  <!-- Arrow: analyze -> prompt_builder -->
  <line x1="690" y1="331" x2="690" y2="420" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== Layer 4: AI Pipeline ===== -->
  <rect x="30" y="405" width="900" height="80" rx="8" fill="#faf5ff" stroke="#ede9fe" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="427" font-size="11" fill="#9333ea" font-weight="600">AI PIPELINE</text>

  <!-- prompt_builder.py -->
  <g filter="url(#shadow)">
    <rect x="420" y="435" width="200" height="40" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="520" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">prompt_builder.py</text>
  </g>
  <text x="520" y="488" text-anchor="middle" font-size="10" fill="#6b7280">ANALYSIS_METHODOLOGY</text>

  <!-- llm_client.py -->
  <g filter="url(#shadow)">
    <rect x="700" y="435" width="180" height="40" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="790" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">llm_client.py</text>
  </g>
  <text x="790" y="488" text-anchor="middle" font-size="10" fill="#6b7280">OpenAI + Anthropic</text>
  <line x1="620" y1="455" x2="698" y2="455" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 问题描述 arrow to prompt_builder -->
  <path d="M 720 128 L 720 260 L 820 260 L 820 420 L 520 420 L 520 433" stroke="#dc2626" stroke-width="1" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
  <rect x="724" y="195" width="72" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="760" y="207" text-anchor="middle" font-size="10" fill="#6b7280">context</text>

  <!-- Arrow: AI -> Output -->
  <line x1="790" y1="475" x2="790" y2="530" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ===== Layer 5: Output ===== -->
  <rect x="30" y="520" width="900" height="70" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="542" font-size="11" fill="#dc2626" font-weight="600">OUTPUT</text>

  <!-- Diagnosis Report -->
  <g filter="url(#shadow)">
    <rect x="350" y="545" width="200" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="450" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Diagnosis Report</text>
  </g>

  <!-- Extracted Data -->
  <g filter="url(#shadow)">
    <rect x="620" y="545" width="180" height="36" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="710" y="568" text-anchor="middle" font-size="13" fill="#111827">_extracted.md</text>
  </g>

  <!-- analyze -> extracted -->
  <line x1="690" y1="370" x2="690" y2="395" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2"/>
  <path d="M 690 395 L 710 395 L 710 543" stroke="#16a34a" stroke-width="1" fill="none" stroke-dasharray="4,2" marker-end="url(#arrow-green)"/>

  <!-- wifi_analyzer.py orchestrator badge -->
  <g filter="url(#shadow)">
    <rect x="80" y="435" width="200" height="40" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="180" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">wifi_analyzer.py</text>
  </g>
  <text x="180" y="488" text-anchor="middle" font-size="10" fill="#6b7280">CLI entry point / orchestrator</text>
  <line x1="280" y1="455" x2="418" y2="455" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
  <rect x="296" y="442" width="50" height="14" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="321" y="453" text-anchor="middle" font-size="9" fill="#6b7280">wires</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40, 620)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#111827">Legend</text>
    <line x1="0" y1="16" x2="30" y2="16" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="36" y="20" font-size="11" fill="#6b7280">Parse / process flow</text>
    <line x1="170" y1="16" x2="200" y2="16" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="206" y="20" font-size="11" fill="#6b7280">Data / dict output</text>
    <line x1="340" y1="16" x2="370" y2="16" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="376" y="20" font-size="11" fill="#6b7280">AI pipeline flow</text>
    <line x1="510" y1="16" x2="540" y2="16" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-gray)"/>
    <text x="546" y="20" font-size="11" fill="#6b7280">Reference / import</text>
  </g>

  <!-- Annotations -->
  <text x="480" y="670" text-anchor="middle" font-size="10" fill="#9ca3af">Pure Python 3.10+ · Zero external dependencies · Config: CLI args &gt; env vars &gt; ~/.wifi_analyzer.json</text>

</svg>
